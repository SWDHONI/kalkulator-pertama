
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Pertamaku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <h1>Kalkulator Saya</h1>
    <input type="number" id="angka1" placeholder="Angka pertama">
    <input type="number" id="angka2" placeholder="Angka kedua">

    <div class="buttons">
      <button onclick="hitung('+')">+</button>
      <button onclick="hitung('-')">−</button>
      <button onclick="hitung('*')">×</button>
      <button onclick="hitung('/')">÷</button>
    </div>

    <h2 id="hasil">Hasil: 0</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
